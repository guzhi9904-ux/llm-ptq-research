# 新实验从该模板复制；不要直接修改已有正式配置和结果目录。
experiment:
  id: method_model_setting_seed0
  method: quarot                 # 必须对应 adapters/methods.yaml 中的方法标识。
  stage: quantize_eval           # 同一方法可有预处理、量化和评测等不同阶段。
  evidence_level: controlled     # controlled 表示本仓库统一协议，不冒充论文原表设置。

resources:
  model: llama2_7b_local         # 只引用资源别名，不写服务器绝对路径。
  dataset: c4

parameters:
  format: int
  weight_bits: 4
  activation_bits: 4
  kv_bits: 4
  weight_group_size: null
  calibration_samples: 128
  sequence_length: 2048

arguments:
  # 这里写官方入口真实接收的参数；统一入口不会猜测或改名。
  - --rotate
  - --w_bits
  - "4"
  - --a_bits
  - "4"
  - --k_bits
  - "4"
  - --v_bits
  - "4"

runtime:
  python: python
  gpus: [0]
  seed: 0

environment: {}

output:
  # 每个配置使用唯一目录；入口拒绝覆盖非空结果目录。
  run_dir: "{{ roots.output_root }}/method_model_setting_seed0"
