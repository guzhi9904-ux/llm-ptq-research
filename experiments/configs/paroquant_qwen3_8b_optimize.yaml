# ParoQuant legacy 分支的 INT4 优化脚本；第二个位置参数表示 calibration cache shard 数。
experiment:
  id: paroquant_qwen3_8b_int4_optimize_seed0
  method: paroquant
  stage: optimize_4bit
  evidence_level: upstream

resources:
  model: qwen3_8b_local
  dataset: wikitext2

parameters:
  weight_bits: 4
  group_size: 128
  num_rotations: 8
  epochs: [10, 10]
  training_samples: 2048
  validation_samples: 64
  sequence_length: 2048
  cache_shards: 1

arguments:
  - "1"

runtime:
  python: python
  gpus: [0]
  seed: 0

output:
  run_dir: "{{ roots.output_root }}/paroquant_qwen3_8b_int4/optimize_log"
