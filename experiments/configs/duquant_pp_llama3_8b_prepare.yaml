# 为 DuQuant++ LLaMA-3-8B MXFP4 实验收集 activation scale 和 shift。
experiment:
  id: duquant_pp_llama3_8b_prepare_128x2048_seed2
  method: duquant_pp
  stage: collect_scales
  evidence_level: reproduction

resources:
  model: llama3_8b_local
  dataset: wikitext2

parameters:
  calibration_samples: 128
  sequence_length: 2048

arguments:
  - --scales-output-path
  - "{{ output.run_dir }}/act_scales"
  - --shifts-output-path
  - "{{ output.run_dir }}/act_shifts"
  - --calib_dataset
  - wikitext2
  - --num-samples
  - "128"
  - --seq-len
  - "2048"
  - --seed
  - "2"

runtime:
  python: python
  gpus: [0]
  seed: 2

output:
  run_dir: "{{ roots.output_root }}/duquant_pp_llama3_8b_mxfp4/prepare"
