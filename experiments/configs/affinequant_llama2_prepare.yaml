# AffineQuant 与 OmniQuant 使用同一类 activation scale/shift 预处理，但产物分开保存。
experiment:
  id: affinequant_llama2_7b_prepare_128x2048_seed2
  method: affinequant
  stage: collect_scales
  evidence_level: reproduction

resources:
  model: llama2_7b_local
  dataset: wikitext2

parameters:
  calibration_samples: 128
  sequence_length: 2048
  calibration_seed: 2

arguments:
  - --scales-output-path
  - "{{ output.run_dir }}/act_scales"
  - --shifts-output-path
  - "{{ output.run_dir }}/act_shifts"
  - --calib_dataset
  - wikitext2
  - --num-samples
  - "128"
  - --seq-len
  - "2048"
  - --seed
  - "2"

runtime:
  python: python
  gpus: [0]
  seed: 2

output:
  run_dir: "{{ roots.output_root }}/affinequant_llama2_7b_w4a4/prepare"
