# GuidedQuant + LNQ：保留与 SqueezeLLM 对照完全相同的校准数据和分组数。
experiment:
  id: guidedquant_llama2_7b_lnq_2bit_groups4
  method: guidedquant
  stage: lnq_quantize
  evidence_level: reproduction

resources:
  model: llama2_7b_local
  dataset: redpajama

parameters:
  backend: lnq
  weight_bits: 2
  gradient_groups: 4
  calibration_samples: 1024
  sequence_length: 4096

arguments:
  - "2"
  - "4"

runtime:
  python: python
  gpus: [0]
  seed: 0

output:
  run_dir: "{{ roots.output_root }}/guidedquant_llama2_7b_lnq_2bit_groups4"
