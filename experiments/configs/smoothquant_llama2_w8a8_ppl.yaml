# 使用上一步生成的 activation scale 做平滑、W8A8 fake quant 和 WikiText-2 PPL。
experiment:
  id: smoothquant_llama2_7b_w8a8_ppl_alpha05
  method: smoothquant
  stage: perplexity
  evidence_level: reproduction

resources:
  model: llama2_7b_local
  dataset: wikitext2

parameters:
  weight_bits: 8
  activation_bits: 8
  alpha: 0.5
  smooth: true
  fake_quant: true
  sequence_length: 2048

arguments:
  - --act_scales_path
  - "{{ roots.output_root }}/smoothquant_llama2_7b_calibration_512x2048_seed0/act_scales.pt"
  - --alpha
  - "0.5"
  - --smooth
  - --quantize

runtime:
  python: python
  gpus: [0]
  seed: 0

output:
  run_dir: "{{ roots.output_root }}/smoothquant_llama2_7b_w8a8_ppl_alpha05"
