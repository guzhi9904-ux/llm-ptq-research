# OmniQuant 论文常用的 LLaMA-2-7B W4A4 LET+LWC 设置。
experiment:
  id: omniquant_llama2_7b_w4a4_let_lwc_seed2
  method: omniquant
  stage: quantize_eval
  evidence_level: reproduction

resources:
  model: llama2_7b_local
  dataset: wikitext2

parameters:
  weight_bits: 4
  activation_bits: 4
  calibration_samples: 128
  epochs: 20
  let_lr: 0.005
  lwc_lr: 0.01
  let: true
  lwc: true

arguments:
  - --output_dir
  - "{{ output.run_dir }}/model_output"
  - --eval_ppl
  - --wbits
  - "4"
  - --abits
  - "4"
  - --epochs
  - "20"
  - --let
  - --lwc
  - --act-scales
  - "{{ roots.output_root }}/omniquant_llama2_7b_w4a4/prepare/act_scales/Llama-2-7b.pt"
  - --act-shifts
  - "{{ roots.output_root }}/omniquant_llama2_7b_w4a4/prepare/act_shifts/Llama-2-7b.pt"
  - --tasks
  - piqa,arc_easy,arc_challenge,boolq,hellaswag,winogrande

runtime:
  python: python
  gpus: [0]
  seed: 2

output:
  run_dir: "{{ roots.output_root }}/omniquant_llama2_7b_w4a4/quantize"
