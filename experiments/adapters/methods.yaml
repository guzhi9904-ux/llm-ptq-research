# 方法适配层只描述工作目录和官方入口前缀；算法参数完整写在实验配置中。
version: 1

methods:
  gptq:
    display_name: GPTQ
    family: int/gptq
    environment: gptq_legacy
    source_policy: tracked
    status: runnable
    working_dir: int/gptq/GPTQ/upstream
    stages:
      quantize_eval:
        description_zh: 原始 LLaMA weight-only GPTQ 与 PPL 评测入口。
        command: ["{{ runtime.python }}", llama.py, "{{ model.locator }}", "{{ dataset.locator }}"]
        required_files: [llama.py, gptq.py, quant.py]

  smoothquant:
    display_name: SmoothQuant
    family: int/smooth
    environment: smoothquant
    source_policy: tracked
    status: runnable
    working_dir: int/smooth/SmoothQuant/upstream
    stages:
      calibrate:
        description_zh: 收集 per-channel activation max。
        command: ["{{ runtime.python }}", examples/generate_act_scales.py, --model-name, "{{ model.locator }}"]
        required_files: [examples/generate_act_scales.py]
      perplexity:
        description_zh: 执行平滑、fake W8A8 与 PPL 评测。
        command: ["{{ runtime.python }}", smoothquant/ppl_eval.py, --model_path, "{{ model.locator }}"]
        required_files: [smoothquant/ppl_eval.py, smoothquant/smooth.py]

  omniquant:
    display_name: OmniQuant
    family: int/rotation-transform
    environment: omniquant
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/OmniQuant/upstream
    stages:
      collect_scales:
        description_zh: 为指定模型收集 activation scale 与 shift。
        command: ["{{ runtime.python }}", generate_act_scale_shift.py, --model, "{{ model.locator }}"]
        required_files: [generate_act_scale_shift.py]
      quantize_eval:
        description_zh: LET/LWC block 重构与评测。
        command: ["{{ runtime.python }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py]

  affinequant:
    display_name: AffineQuant
    family: int/rotation-transform
    environment: affinequant
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/AffineQuant/upstream
    stages:
      collect_scales:
        description_zh: 为指定模型收集 activation scale 与 shift。
        command: ["{{ runtime.python }}", generate_act_scale_shift.py, --model, "{{ model.locator }}"]
        required_files: [generate_act_scale_shift.py]
      quantize_eval:
        description_zh: 可学习 affine transformation 与 clipping 评测。
        command: ["{{ runtime.python }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py]

  quarot:
    display_name: QuaRot
    family: int/rotation
    environment: quarot
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/QuaRot/upstream/fake_quant
    stages:
      quantize_eval:
        description_zh: QuaRot fake-quant 精度入口。
        command: ["{{ runtime.python }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py, rotation_utils.py, gptq_utils.py]

  duquant:
    display_name: DuQuant
    family: int/rotation-transform
    environment: duquant
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/DuQuant/upstream
    stages:
      prepare_rotation:
        description_zh: 生成所有模型共用的 rotation 基础数据。
        command: ["{{ runtime.python }}", get_rot.py]
        required_files: [get_rot.py]
      collect_scales:
        description_zh: 为指定模型收集 activation scale 与 shift。
        command: ["{{ runtime.python }}", generate_act_scale_shift.py, --model, "{{ model.locator }}"]
        required_files: [generate_act_scale_shift.py]
      quantize_eval:
        description_zh: DuQuant W4A4 主实验入口。
        command: ["{{ runtime.python }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py]

  spinquant:
    display_name: SpinQuant
    family: int/rotation
    environment: spinquant
    source_policy: noncommercial
    status: runnable
    working_dir: int/rotation/SpinQuant/upstream
    stages:
      optimize_rotation:
        description_zh: 显式调用官方 rotation 优化入口，输出路径由统一配置给出。
        command: [torchrun, --nnodes, "1", --nproc_per_node, "{{ runtime.processes }}", optimize_rotation.py, --input_model, "{{ model.locator }}"]
        required_files: [optimize_rotation.py]
      quantize_eval:
        description_zh: 使用已学习 rotation 执行 RTN/GPTQ 评测，避免官方 shell 中的 your_path 占位符。
        command: [torchrun, --nnodes, "1", --nproc_per_node, "{{ runtime.processes }}", ptq.py, --input_model, "{{ model.locator }}"]
        required_files: [ptq.py]

  ostquant:
    display_name: OSTQuant
    family: int/rotation-transform
    environment: ostquant
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/OSTQuant/upstream
    stages:
      quantize_eval:
        description_zh: 通过 torchrun 从头优化并评测 OSTQuant。
        command: [torchrun, --nnodes, "1", --nproc_per_node, "{{ runtime.processes }}", --master-addr, localhost, --master-port, "{{ runtime.master_port }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py]

  flatquant:
    display_name: FlatQuant
    family: int/rotation-transform
    environment: flatquant
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/FlatQuant/upstream
    stages:
      quantize_eval:
        description_zh: FlatQuant calibration、矩阵保存与评测入口。
        command: ["{{ runtime.python }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py, gptq_utils.py]

  paroquant:
    display_name: ParoQuant
    family: int/rotation
    environment: paroquant
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/ParoQuant/upstream
    stages:
      optimize_4bit:
        description_zh: legacy 分支的 4-bit 优化脚本。
        command: [bash, experiments/optimize/4bit.sh, "{{ model.locator }}"]
        required_files: [experiments/optimize/4bit.sh, optimize.py]
      export_pseudo:
        description_zh: 导出保留 FP16 权重的 pseudo-quant 模型。
        command: ["{{ runtime.python }}", scripts/pseudo_quant.py, --model, "{{ model.locator }}"]
        required_files: [scripts/pseudo_quant.py]
      export_real:
        description_zh: 导出真实 INT4 模型。
        command: ["{{ runtime.python }}", scripts/real_quant.py, --model, "{{ model.locator }}"]
        required_files: [scripts/real_quant.py]

  q_palette:
    display_name: Q-Palette
    family: int/rotation-codebook
    environment: q_palette
    source_policy: tracked
    status: runnable
    working_dir: int/rotation/Q-Palette/upstream
    stages:
      solve_memory:
        description_zh: 求解平均 bit 约束下的层级 quantizer 分配。
        command: ["{{ runtime.python }}", solve_mem_const.py, --model, "{{ model.locator }}"]
        required_files: [solve_mem_const.py]
      evaluate:
        description_zh: 评测已生成的 quantizer dictionary。
        command: ["{{ runtime.python }}", eval_qdict.py]
        required_files: [eval_qdict.py]

  guidedquant:
    display_name: GuidedQuant
    family: int/gptq-enhancement
    environment: guidedquant
    source_policy: tracked
    status: manual
    working_dir: int/gptq/GuidedQuant/upstream
    stages:
      sqllm_quantize:
        description_zh: 以 SqueezeLLM backend 运行 GuidedQuant，脚本参数依次是 bit 数和 gradient averaging group 数。
        command: [bash, scripts/run_sqllm.sh, "{{ model.locator }}"]
        required_files: [scripts/run_sqllm.sh, quantize.py]
      lnq_quantize:
        description_zh: 以论文提出的 LNQ scalar quantizer 运行 GuidedQuant。
        command: [bash, scripts/run_lnq.sh, "{{ model.locator }}"]
        required_files: [scripts/run_lnq.sh, layerwise_nuq.py]
    note_zh: 官方流程包含梯度收集、层级量化和 kernel 转换，尚未压缩成单一安全入口。

  sliderquant:
    display_name: SliderQuant
    family: int/learned-ptq
    environment: sliderquant
    source_policy: tracked
    status: manual
    working_dir: int/rotation/SliderQuant/upstream
    stages:
      direct_quantize_eval:
        description_zh: 直接调用 main.py 和官方 W4A4 配置，避免自动脚本改写 task_list.conf。
        command: ["{{ runtime.python }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py, configs/llama2-7b-w4a4/config.yaml]
    note_zh: 官方入口依赖会修改 task_list.conf 的任务队列，适配前保持手工执行。

  mr_gptq_reference:
    display_name: MR-GPTQ PyTorch 复现
    family: fp4/reference
    environment: fp4_reference
    source_policy: original_mit
    status: synthetic_smoke_tested
    working_dir: fp4/reference
    stages:
      synthetic:
        description_zh: 不下载模型的 MR-GPTQ 合成张量测试。
        command: ["{{ runtime.python }}", examples/synthetic_demo.py, mr-gptq]
        required_files: [examples/synthetic_demo.py, src/ptq_fp4_reference/mr_gptq.py]

  fp4_baseline_reference:
    display_name: FP4 Baseline PyTorch 复现
    family: fp4/reference
    environment: fp4_reference
    source_policy: original_mit
    status: synthetic_smoke_tested
    working_dir: fp4/reference
    stages:
      synthetic:
        description_zh: 不下载模型，分别检查 RTN、Rotation + RTN 和 GPTQ。
        command: ["{{ runtime.python }}", examples/synthetic_demo.py, baseline]
        required_files: [examples/synthetic_demo.py, src/ptq_fp4_reference/baselines.py]

  micromix_reference:
    display_name: MicroMix PyTorch 复现
    family: fp4/reference
    environment: fp4_reference
    source_policy: original_mit
    status: synthetic_smoke_tested
    working_dir: fp4/reference
    stages:
      synthetic:
        description_zh: 不下载模型的 MicroMix 合成张量测试。
        command: ["{{ runtime.python }}", examples/synthetic_demo.py, micromix]
        required_files: [examples/synthetic_demo.py, src/ptq_fp4_reference/micromix.py]

  fp4_rtn:
    display_name: FP4 RTN baseline
    family: fp4/baseline
    environment: fp_quant
    source_policy: user_authorized_snapshot
    status: runnable
    working_dir: fp4/methods/MR-GPTQ/upstream
    stages:
      quantize_eval:
        description_zh: 使用 FP-Quant 的格式正确 RTN 基线；配置中不得加入 --gptq。
        command: ["{{ runtime.python }}", model_quant.py, --model_name_or_path, "{{ model.locator }}"]
        required_files: [model_quant.py]

  fp4_gptq:
    display_name: FP4 GPTQ baseline
    family: fp4/baseline
    environment: fp_quant
    source_policy: user_authorized_snapshot
    status: runnable
    working_dir: fp4/methods/MR-GPTQ/upstream
    stages:
      quantize_eval:
        description_zh: identity transform 下的格式正确 FP4 GPTQ 基线。
        command: ["{{ runtime.python }}", model_quant.py, --model_name_or_path, "{{ model.locator }}"]
        required_files: [model_quant.py]

  fp4_rotation:
    display_name: FP4 Rotation baseline
    family: fp4/baseline
    environment: fp_quant
    source_policy: user_authorized_snapshot
    status: runnable
    working_dir: fp4/methods/MR-GPTQ/upstream
    stages:
      quantize_eval:
        description_zh: Hadamard transform + RTN，不启用 GPTQ。
        command: ["{{ runtime.python }}", model_quant.py, --model_name_or_path, "{{ model.locator }}"]
        required_files: [model_quant.py]

  mr_gptq:
    display_name: MR-GPTQ
    family: fp4/format-specific
    environment: fp_quant
    source_policy: user_authorized_snapshot
    status: runnable
    working_dir: fp4/methods/MR-GPTQ/upstream
    stages:
      quantize_eval:
        description_zh: Hadamard transform 坐标系中的 FP4 GPTQ。
        command: ["{{ runtime.python }}", model_quant.py, --model_name_or_path, "{{ model.locator }}"]
        required_files: [model_quant.py]

  micromix:
    display_name: MicroMix
    family: fp4/mixed-precision
    environment: micromix
    source_policy: user_authorized_snapshot
    status: runnable
    working_dir: fp4/methods/MicroMix/upstream
    stages:
      preprocess:
        description_zh: 统计 activation 并生成 channel reorder indices。
        command: ["{{ runtime.python }}", reorder_indices.py, --model, "{{ model.locator }}"]
        required_files: [reorder_indices.py]
      evaluate:
        description_zh: 官方 test.sh 精度评测入口。
        command: [bash, test.sh, "{{ model.locator }}"]
        required_files: [test.sh]

  duquant_pp:
    display_name: DuQuant++
    family: fp4/rotation
    environment: duquant_pp
    source_policy: tracked
    status: runnable
    working_dir: fp4/methods/DuQuantPP/upstream
    stages:
      prepare_rotation:
        description_zh: 生成 rotation 基础数据。
        command: ["{{ runtime.python }}", get_rot.py]
        required_files: [get_rot.py]
      collect_scales:
        description_zh: 收集模型 activation scale 与 shift。
        command: ["{{ runtime.python }}", generate_act_scale_shift.py, --model, "{{ model.locator }}"]
        required_files: [generate_act_scale_shift.py]
      quantize_eval:
        description_zh: MXFP4 DuQuant++ 与可选 GPTQ 评测入口。
        command: ["{{ runtime.python }}", main.py, --model, "{{ model.locator }}"]
        required_files: [main.py, quantize/fp4_ops.py]

  fouroversix:
    display_name: Four Over Six
    family: fp4/adaptive-scaling
    environment: fouroversix
    source_policy: tracked
    status: runnable
    working_dir: fp4/methods/FourOverSix/upstream
    stages:
      adaptive_rtn:
        description_zh: 使用 Four Over Six 默认自适应 scale rule 做 RTN。
        command: ["{{ runtime.python }}", -m, scripts.ptq_hf, --model-name, "{{ model.locator }}", --ptq-method, rtn]
        required_files: [scripts/ptq_hf/__main__.py, src/fouroversix/quantize/pytorch/reference.py]
      nvfp4_rtn:
        description_zh: 固定 scale rule 6，作为标准 NVFP4 RTN 对照。
        command: ["{{ runtime.python }}", -m, scripts.ptq_hf, --model-name, "{{ model.locator }}", --ptq-method, rtn, --a-scale-rule, static_6, --w-scale-rule, static_6]
        required_files: [scripts/ptq_hf/__main__.py, src/fouroversix/quantize/pytorch/reference.py]

  mixfp4_reference:
    display_name: MixFP4 Algorithm 1 PyTorch 复现
    family: fp4/adaptive-format
    environment: fp4_reference
    source_policy: original_mit
    status: synthetic_smoke_tested
    working_dir: fp4/reference
    stages:
      synthetic:
        description_zh: 用合成张量检查 E2M1/E1M2 逐 block MSE 选择。
        command: ["{{ runtime.python }}", examples/synthetic_demo.py, mixfp4]
        required_files: [examples/synthetic_demo.py, src/ptq_fp4_reference/mixfp4.py]
