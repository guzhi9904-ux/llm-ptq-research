name: 轻量验证

on:
  push:
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 取得代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environments/ci-requirements.txt

      - name: 安装轻量检查依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environments/ci-requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1

      - name: 检查配置、入口和文档链接
        run: python tools/validate_repository.py

      - name: 运行 CPU 测试
        run: python -m pytest -q
