[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ptq-fp4-reference"
version = "0.2.0"
description = "FP4 baseline、MR-GPTQ、MicroMix 与 MixFP4 的 PyTorch 参考实现"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ptq-fp4-reference = "ptq_fp4_reference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
