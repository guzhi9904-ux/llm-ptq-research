# 复制为 resources.local.yaml 后填写本机路径；local 文件不会进入 Git。
version: 1

roots:
  # 四个环境变量应指向持久磁盘，避免把模型和缓存写入代码仓库。
  model_root: ${PTQ_MODEL_ROOT}
  dataset_root: ${PTQ_DATASET_ROOT}
  cache_root: ${PTQ_CACHE_ROOT}
  output_root: ${PTQ_OUTPUT_ROOT}

models:
  llama2_7b_local:
    kind: local
    path: "{{ roots.model_root }}/meta-llama/Llama-2-7b-hf"
    family: llama
    revision: local_snapshot
    gated: true

  llama3_8b_local:
    kind: local
    path: "{{ roots.model_root }}/meta-llama/Meta-Llama-3-8B"
    family: llama
    revision: local_snapshot
    gated: true

  llama3_2_1b_instruct_local:
    kind: local
    path: "{{ roots.model_root }}/meta-llama/Llama-3.2-1B-Instruct"
    family: llama
    revision: local_snapshot
    gated: true

  qwen3_8b_local:
    kind: local
    path: "{{ roots.model_root }}/Qwen/Qwen3-8B"
    family: qwen3
    revision: local_snapshot
    gated: false

  llama2_7b_hub:
    kind: hub
    identifier: meta-llama/Llama-2-7b-hf
    family: llama
    # 正式结果必须把 null 改成 Hugging Face commit hash。
    revision: null
    gated: true

datasets:
  c4:
    kind: builtin
    # 原始 GPTQ 等入口直接接收短名称 c4。
    argument: c4
    identifier: allenai/c4
    subset: en
    split: train
    revision: null

  wikitext2:
    kind: builtin
    argument: wikitext2
    identifier: Salesforce/wikitext
    subset: wikitext-2-raw-v1
    split: test
    revision: null

  pile_validation_local:
    kind: local
    path: "{{ roots.dataset_root }}/pile/val.jsonl.zst"
    identifier: monology/pile-uncopyrighted
    split: validation
    revision: local_snapshot

  fineweb_edu:
    kind: builtin
    # FP-Quant 内部把该短名称映射到自己的数据加载逻辑。
    argument: fineweb-edu
    identifier: HuggingFaceFW/fineweb-edu
    split: train
    revision: null
